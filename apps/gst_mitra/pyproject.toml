[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gst_mitra"
version = "0.1.0"
description = "GST Mitra extensions for ERPNext and Frappe"
authors = [{ name = "GST Mitra" }]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["gst_mitra*"]
